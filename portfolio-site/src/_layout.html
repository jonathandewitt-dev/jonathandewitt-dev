<!-- Since this file begins with an underscore, it will be excluded from the output. -->
<!-- This markup will only be rendered if a page includes it with <?layout href="_layout.html"> -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Jonathan DeWitt (Jon) builds developer tools that bridge great developer experience and the native web platform. Explore his projects, experience, and engineering philosophy."
		/>
		<title>Jonathan DeWitt<script expr>title !== '' ? ` | ${title}` : ''</script></title>
		<link rel="stylesheet" href="/global.css" />
	</head>
	<body>
		<!-- This view element is used for CSR navigation, only this element will be replaced when navigating -->
		<t-view id="main-content">
			<x-page expr:prominent="pathname === '/'">
				<script expr>
					breadcrumbs.length === 1
						? html`
								<hgroup slot="header">
									<h1>${heading}</h1>
									${breadcrumbs.length === 1 ? html`<h2>Engineering Leader & Product Innovator</h2>` : ''}
								</hgroup>
							`
						: html`<h1 slot="header">${heading}</h1>`;
				</script>

				<script expr>
					breadcrumbs.length > 1
						? html`
								<nav slot="header">
									<p>${breadcrumbs.map((crumb) => html`<x-crumb href="${crumb.pathname}">${crumb.name}</x-crumb>`)}</p>
								</nav>
							`
						: '';
				</script>

				<!-- This is where page content is inserted when this layout is used -->
				<slot></slot>
			</x-page>
		</t-view>

		<script isomorphic src="/component-registry.ts"></script>

		<script server>
			import { getMeta } from 'thunderous-server';

			// This makes some handy data available to the template, like breadcrumbs
			const meta = getMeta();
			const headings = {
				'/': 'Jonathan DeWitt',
				'/about': 'About Me',
				'/work': 'My Work',
				'/contact': 'Contact Me',
			};
			const heading = headings[meta.pathname] ?? meta.title;
			export default { ...meta, title: meta.pathname === '/' ? '' : heading, heading };
		</script>
	</body>
</html>
